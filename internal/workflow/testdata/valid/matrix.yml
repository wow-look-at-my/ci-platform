name: Matrix

on:
  push:
    branches: [main, "release/**"]

jobs:
  build:
    name: build ${{ matrix.os }} / go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "1.24"]
        arch: [amd64, arm64]
        include:
          - os: ubuntu-latest
            go: "1.24"
            arch: amd64
            coverage: true
          - os: ubuntu-latest
            experimental: true
        exclude:
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            go: "1.23"
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: go build ./...
        env:
          GOARCH: ${{ matrix.arch }}
      - name: coverage
        if: matrix.coverage
        run: go test -cover ./...
