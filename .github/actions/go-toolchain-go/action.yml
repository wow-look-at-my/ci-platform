name: go-toolchain go
description: Installs go-toolchain so a job can run `go-toolchain go ...`, the org's Go, and lets the kernel exec the APE binaries it builds.
runs:
  using: composite
  steps:
    # Exports GO_BUILDCACHE_CONFIG, without which go-toolchain's go refuses to build when CI is set.
    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Install go-toolchain
      shell: bash
      run: |
        set -euo pipefail
        curl -fL --compressed --connect-timeout 20 --max-time 120 -o /tmp/go-toolchain "https://dl.pazer.build/go-toolchain?os=${RUNNER_OS}&arch=${RUNNER_ARCH}"
        chmod +x /tmp/go-toolchain
        /tmp/go-toolchain version
        sudo cp /tmp/go-toolchain /usr/local/bin/go-toolchain
        # Named go, the binary is the go command, so a test that execs `go` gets the org's Go rather than the runner's.
        mkdir -p "$RUNNER_TEMP/go-bin"
        ln -s /usr/local/bin/go-toolchain "$RUNNER_TEMP/go-bin/go"
        echo "$RUNNER_TEMP/go-bin" >> "$GITHUB_PATH"
        # GO_TOOLCHAIN_LINKED_GO tells go-toolchain its own go is the one on PATH. GOPROXY and
        # GOSUMDB are deliberately not set: go-toolchain fetches modules itself and refuses to run
        # when GOPROXY names a proxy it does not use.
        echo "GO_TOOLCHAIN_LINKED_GO=1" >> "$GITHUB_ENV"

    - name: Register the APE binfmt handler
      shell: bash
      run: |
        set -euo pipefail
        dir=/proc/sys/fs/binfmt_misc
        if [ -e "$dir/APE" ]; then
          exit 0
        fi
        if [ ! -e "$dir/register" ]; then
          sudo mount -t binfmt_misc binfmt_misc "$dir"
        fi
        printf '%s\n' ':APE:M::\x4d\x5a\x71\x46\x70\x44\x3d\x27::/bin/sh:' | sudo tee "$dir/register" > /dev/null
        test -e "$dir/APE"
