name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  # The committed web/ bundle is what go:embed ships. A stale bundle is a
  # silent lie about what the UI does, so a mismatch fails the build.
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/buildweb -check

  # The demo site: the real UI against a snapshot captured from the real API.
  # Published per branch, so a UI change can be looked at before it is merged.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A stale snapshot would show shapes the API no longer returns, which is
      # the one thing a demo of this platform must not do.
      - run: go run ./cmd/demofixtures -check
      - run: go run ./cmd/buildweb -demo -out demo-site
      - name: Site branch name
        id: sitename
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // buildhost serves a site under one path segment, so anything
            // outside [A-Za-z0-9._-] is flattened out of the branch name.
            core.setOutput('branch', (github.ref_name || 'branch').replace(/[^A-Za-z0-9._-]/g, '-'));
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: https://pazer.build
          project: ci-platform
          branch: ${{ steps.sitename.outputs.branch }}
          source_dir: demo-site

  # Reads every workflow in the corpus and asserts each is either fully
  # supported or explicitly refused, and that job names still match GitHub's.
  # A job name is what branch protection matches on, so a change here breaks
  # somebody's merge queue silently.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./test/conformance/... -count=1

  # One test per incident in docs/incidents.md. These are the product: if a
  # killed runner stops requeuing, or a 524 stops being classified as infra,
  # the platform has lost the only thing it claims over GitHub Actions.
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          CIPLATFORM_TEST_DOCKER: "1"
        run: go test ./test/chaos/... -count=1 -timeout 20m

  # Runs real workflows through a real control plane and a real runner, using
  # unmodified actions/checkout, actions/cache, and actions/upload-artifact.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          CIPLATFORM_TEST_DOCKER: "1"
        run: go test ./test/e2e/... -count=1 -timeout 30m
